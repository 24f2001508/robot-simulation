amcl:
  ros__parameters:
    use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    transform_staleness_threshold: 0.5
    transform_tolerance: 0.5
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.05
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0

      min_vel_theta: -0.5
      max_vel_theta: 0.5

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.5

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


behavior_server:
  ros__parameters:
    use_sim_time: true

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link

    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link

      rolling_window: false

      width: 30
      height: 30
      resolution: 0.05

      origin_x: -15.0
      origin_y: -15.0

      track_unknown_space: true

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5


waypoint_follower:
  ros__parameters:
    use_sim_time: true


velocity_smoother:
  ros__parameters:
    use_sim_time: true
